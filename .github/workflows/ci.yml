name: MerchAI CI Pipeline

on:
  push:
    branches:
      - main
      - development
      - 'fix/**'
      - 'feature/**'
  pull_request:
    branches:
      - main
      - development

jobs:
  frontend-build:
    name: Frontend Lint & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Frontend Build (TypeCheck & Vite Bundle)
        working-directory: ./frontend
        run: npm run build

  backend-safety-and-unit-tests:
    name: Backend Safety & Isolated Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Python Syntax & Compilation Verification
        run: |
          python -m compileall backend/app backend/tests

      - name: Run Isolated Security Safeguards & Health Tests
        env:
          APP_ENV: testing
          TESTING: "1"
          MYSQL_TEST_HOST: 127.0.0.1
          MYSQL_TEST_PORT: "3306"
          MYSQL_TEST_DB: ai_commerce_test
          ALLOW_PRODUCTION_DB_ACCESS: "false"
        run: |
          pytest backend/tests/test_security_safeguards.py backend/tests/test_health.py -v
